name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options: [staging, production]
      image_digest:
        description: 'Immutable OCI image digest (sha256:...)'
        required: true
        type: string
      source_commit:
        description: 'Source commit SHA the image was built from'
        required: true
        type: string
      image_tag:
        description: 'Human-readable tag for this deployment (sha-xxxxxxx or vX.Y.Z)'
        required: true
        type: string
      health_check_url:
        description: 'Optional base URL for post-deploy health verification'
        required: false
        type: string
        default: ''

permissions:
  contents: write

# Deliberately prefixed "cd-state-", not "deploy-": deploy-vps.yml (called by the
# deploy job below) uses its own concurrency group
# `deploy-vps-frontend-${{ inputs.environment }}`. Keeping this group distinct
# avoids the run waiting on a slot it already holds via its own deploy job, which
# GitHub Actions would cancel as a detected deadlock. See
# deployment-workflows/docs/WORKFLOW_CONTRACTS.md, "Concurrency deadlock trap".
concurrency:
  group: cd-state-frontend-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  update-desired-state:
    runs-on: ubuntu-latest
    outputs:
      image-repository: ${{ steps.read.outputs.image_repository }}
    steps:
      - name: Obtain GitHub App token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ vars.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Validate digest format
        run: |
          if [[ ! "${{ inputs.image_digest }}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::image_digest must be an immutable sha256 digest, got: ${{ inputs.image_digest }}"
            exit 1
          fi

      - name: Update environment desired state
        env:
          ENV_FILE: environments/${{ inputs.environment }}.yaml
        run: |
          if [ ! -f "$ENV_FILE" ]; then
            echo "::error::No such environment file: $ENV_FILE"
            exit 1
          fi
          sed -i.bak -E \
            -e "s|^(  tag: ).*|\1${{ inputs.image_tag }}|" \
            -e "s|^(  digest: \").*(\")$|\1${{ inputs.image_digest }}\2|" \
            -e "s|^(  commit: \").*(\")$|\1${{ inputs.source_commit }}\2|" \
            "$ENV_FILE"
          rm -f "${ENV_FILE}.bak"
          cat "$ENV_FILE"

      - name: Read image repository
        id: read
        run: |
          IMAGE_REPO=$(grep -E '^\s*imageRepository:' service.yaml | sed -E 's/^\s*imageRepository:\s*//')
          echo "image_repository=${IMAGE_REPO}" >> "$GITHUB_OUTPUT"

      - name: Commit desired state
        run: |
          git config user.name "city-pulse-automation"
          git config user.email "automation@citypulse.local"
          git add environments/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(${{ inputs.environment }}): deploy frontend ${{ inputs.image_tag }}"
            git push
          fi

  push-config:
    needs: update-desired-state
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Map environment to box directory
        id: env
        run: |
          case "${{ inputs.environment }}" in
            production) echo "dir=prod"    >> "$GITHUB_OUTPUT" ;;
            staging)    echo "dir=staging" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::unsupported environment: ${{ inputs.environment }}"; exit 1 ;;
          esac

      # Runtime config for the SPA image. The entrypoint reads app-config.json at
      # startup: everything except API_GATEWAY_URL is copied into
      # window.__APP_CONFIG__; API_GATEWAY_URL is the nginx /api proxy target.
      # No secret values today, but resolve-config keeps the %%SECRET:NAME%%
      # substitution generic — add one SECRET_<NAME> env line + a matching token
      # in config/app-config.<env>.json when a real secret is needed.
      - name: Resolve app config
        uses: mustapha-smail-org/deployment-workflows/.github/actions/resolve-config@main
        with:
          template: config/app-config.${{ inputs.environment }}.json
          output: staging-out/app-config.json

      - name: Set up SSH to the VPS
        uses: mustapha-smail-org/deployment-workflows/.github/actions/vps-ssh-setup@main
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          known-hosts: ${{ secrets.VPS_KNOWN_HOSTS }}

      - name: Deliver config to the VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEST: /opt/citypulse/platform-infrastructure/environments/${{ steps.env.outputs.dir }}/secrets
        run: |
          scp -i ~/.ssh/vps_deploy_key -o IdentitiesOnly=yes \
            staging-out/app-config.json \
            "${VPS_USER}@${VPS_HOST}:${DEST}/"
          ssh -i ~/.ssh/vps_deploy_key -o IdentitiesOnly=yes "${VPS_USER}@${VPS_HOST}" \
            "chmod 600 ${DEST}/app-config.json"
          echo "Delivered app-config.json to ${DEST}"

  deploy:
    needs: [update-desired-state, push-config]
    uses: mustapha-smail-org/deployment-workflows/.github/workflows/deploy-vps.yml@main
    with:
      service-name: frontend
      environment: ${{ inputs.environment }}
      image-digest: ${{ inputs.image_digest }}
    secrets:
      vps-host: ${{ secrets.VPS_HOST }}
      vps-user: ${{ secrets.VPS_USER }}
      vps-ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      vps-known-hosts: ${{ secrets.VPS_KNOWN_HOSTS }}
