name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options: [dev, staging, production]
      image_digest:
        description: 'Immutable OCI image digest (sha256:...)'
        required: true
        type: string
      source_commit:
        description: 'Source commit SHA the image was built from'
        required: true
        type: string
      image_tag:
        description: 'Human-readable tag for this deployment (sha-xxxxxxx or vX.Y.Z)'
        required: true
        type: string
      health_check_url:
        description: 'Optional base URL for post-deploy health verification'
        required: false
        type: string
        default: ''

permissions:
  contents: write

# Deliberately prefixed "cd-state-", not "deploy-": deploy-render.yml (called by
# the deploy job below) uses its own concurrency group
# `deploy-frontend-${{ inputs.environment }}`. If this workflow's top-level group
# resolved to that same string, the run would wait on a concurrency slot it
# already holds via its own deploy job and GitHub Actions would cancel it with
# "Canceling since a deadlock was detected". See
# deployment-workflows/docs/WORKFLOW_CONTRACTS.md, "Concurrency deadlock trap".
concurrency:
  group: cd-state-frontend-${{ inputs.environment }}
  cancel-in-progress: ${{ inputs.environment == 'dev' }}

jobs:
  update-desired-state:
    runs-on: ubuntu-latest
    outputs:
      image-repository: ${{ steps.read.outputs.image_repository }}
    steps:
      - name: Obtain GitHub App token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ vars.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Validate digest format
        run: |
          if [[ ! "${{ inputs.image_digest }}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::image_digest must be an immutable sha256 digest, got: ${{ inputs.image_digest }}"
            exit 1
          fi

      - name: Update environment desired state
        env:
          ENV_FILE: environments/${{ inputs.environment }}.yaml
        run: |
          if [ ! -f "$ENV_FILE" ]; then
            echo "::error::No such environment file: $ENV_FILE"
            exit 1
          fi
          sed -i.bak -E \
            -e "s|^(  tag: ).*|\1${{ inputs.image_tag }}|" \
            -e "s|^(  digest: \").*(\")$|\1${{ inputs.image_digest }}\2|" \
            -e "s|^(  commit: \").*(\")$|\1${{ inputs.source_commit }}\2|" \
            "$ENV_FILE"
          rm -f "${ENV_FILE}.bak"
          cat "$ENV_FILE"

      - name: Read image repository
        id: read
        run: |
          IMAGE_REPO=$(grep -E '^\s*imageRepository:' service.yaml | sed -E 's/^\s*imageRepository:\s*//')
          echo "image_repository=${IMAGE_REPO}" >> "$GITHUB_OUTPUT"

      - name: Commit desired state
        run: |
          git config user.name "city-pulse-automation"
          git config user.email "automation@citypulse.local"
          git add environments/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(${{ inputs.environment }}): deploy frontend ${{ inputs.image_tag }}"
            git push
          fi

  push-config:
    needs: update-desired-state
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Runtime config for the SPA image — see docs/RUNTIME_CONFIG.md and
      # deployment-workflows/docs/TEMPLATE_GUIDE.md §1b/§4. The frontend image's
      # container entrypoint reads this file at startup: everything except
      # API_GATEWAY_URL is copied verbatim into window.__APP_CONFIG__
      # (public/config.js); API_GATEWAY_URL is server-side only, substituted into
      # nginx's proxy_pass target for the same-origin /api/ proxy.
      #
      # No secret values are needed today, but the %%SECRET:NAME%% substitution
      # loop is kept generic and always runs — see
      # data-ingestion-cd/.github/workflows/deploy.yml's push-config job for the
      # pattern this mirrors. Adding a real secret later (e.g. a paid map tile
      # provider token) is one new SECRET_<NAME> env line here, plus a matching
      # %%SECRET:<NAME>%% token in the relevant config/app-config.<env>.json.
      - name: Resolve and push app config to Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ inputs.environment == 'dev' && secrets.RENDER_SERVICE_ID_DEV || inputs.environment == 'staging' && secrets.RENDER_SERVICE_ID_STAGING || secrets.RENDER_SERVICE_ID_PRODUCTION }}
          CONFIG_FILE: config/app-config.${{ inputs.environment }}.json
          CONFIG_FILE_NAME: app-config.json
        run: |
          if [ ! -f "$CONFIG_FILE" ]; then
            echo "::error::No config file for environment '${{ inputs.environment }}' (${CONFIG_FILE})"
            exit 1
          fi

          RESOLVED=$(cat "$CONFIG_FILE")
          for VAR_NAME in $(compgen -v | grep '^SECRET_'); do
            TOKEN_NAME="${VAR_NAME#SECRET_}"
            VALUE="${!VAR_NAME}"
            RESOLVED="${RESOLVED//%%SECRET:${TOKEN_NAME}%%/${VALUE}}"
          done

          if echo "$RESOLVED" | grep -q '%%SECRET:'; then
            echo "::error::Unresolved %%SECRET:...%% placeholder(s) remain in ${CONFIG_FILE} — check that a matching SECRET_<NAME> env var is declared in this step"
            exit 1
          fi

          if [ -z "$RENDER_SERVICE_ID" ]; then
            echo "::error::No RENDER_SERVICE_ID_* secret configured for environment '${{ inputs.environment }}'"
            exit 1
          fi

          PAYLOAD=$(jq -n --arg content "$RESOLVED" '{content: $content}')
          RESPONSE=$(curl -sS -w "\n%{http_code}" -X PUT \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/secret-files/${CONFIG_FILE_NAME}" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Render secret-file API returned HTTP ${HTTP_CODE}: ${BODY}"
            exit 1
          fi

          echo "Pushed config file '${CONFIG_FILE_NAME}' to Render service"

  deploy:
    needs: [update-desired-state, push-config]
    uses: mustapha-smail-org/deployment-workflows/.github/workflows/deploy-render.yml@main
    with:
      service-name: frontend
      environment: ${{ inputs.environment }}
      image-repository: ${{ needs.update-desired-state.outputs.image-repository }}
      image-digest: ${{ inputs.image_digest }}
      health-check-url: ${{ inputs.health_check_url }}
      health-check-path: /healthz
    secrets:
      render-api-key: ${{ secrets.RENDER_API_KEY }}
      service-id: ${{ inputs.environment == 'dev' && secrets.RENDER_SERVICE_ID_DEV || inputs.environment == 'staging' && secrets.RENDER_SERVICE_ID_STAGING || secrets.RENDER_SERVICE_ID_PRODUCTION }}
